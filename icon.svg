<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141a2e" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#090c14" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#040507" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#00e5ff"/>
      <stop offset="70%" stop-color="#7d5fff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#07080c" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="112" fill="#07080c"/>
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  
  <!-- Subtle tech border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#1f273d" stroke-width="2.5" opacity="0.6"/>

  <!-- Orbital Rings -->
  <!-- Outer Orbit (Violet/Arp) -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="#7d5fff" stroke-width="1.8" stroke-dasharray="6 8" opacity="0.35"/>
  
  <!-- Mid Orbit (Cyan/Drone) -->
  <circle cx="256" cy="256" r="132" fill="none" stroke="#00e5ff" stroke-width="2.2" opacity="0.45"/>
  <circle cx="256" cy="256" r="132" fill="none" stroke="#00e5ff" stroke-width="5" opacity="0.15" filter="url(#glow)"/>

  <!-- Inner Orbit (Gold/Chord) -->
  <circle cx="256" cy="256" r="82" fill="none" stroke="#fed330" stroke-width="2" stroke-dasharray="14 6" opacity="0.55"/>

  <!-- Constellation Nodes & Connecting Rays -->
  <line x1="256" y1="256" x2="388" y2="256" stroke="#00e5ff" stroke-width="1.5" opacity="0.3"/>
  <line x1="256" y1="256" x2="162" y2="350" stroke="#fed330" stroke-width="1.5" opacity="0.3"/>
  <line x1="256" y1="256" x2="256" y2="72" stroke="#7d5fff" stroke-width="1.5" opacity="0.3"/>
  <line x1="256" y1="256" x2="126" y2="178" stroke="#ff5fc4" stroke-width="1.5" opacity="0.25"/>

  <!-- Node: Top (Arp) -->
  <circle cx="256" cy="72" r="12" fill="#7d5fff" filter="url(#glow)"/>
  <circle cx="256" cy="72" r="7" fill="#ffffff"/>

  <!-- Node: Mid Right (Drone) -->
  <circle cx="388" cy="256" r="16" fill="#00e5ff" filter="url(#glow)"/>
  <circle cx="388" cy="256" r="9" fill="#e6fcff"/>

  <!-- Node: Inner Bottom Left (Chord) -->
  <circle cx="198" cy="314" r="14" fill="#fed330" filter="url(#glow)"/>
  <circle cx="198" cy="314" r="8" fill="#fffdf0"/>

  <!-- Node: Outer Diagonal (Noise/Reverb) -->
  <circle cx="126" cy="178" r="10" fill="#1dd1a1" opacity="0.8"/>
  <circle cx="126" cy="178" r="5" fill="#ffffff"/>

  <circle cx="370" cy="370" r="13" fill="#ff5fc4" filter="url(#glow)"/>
  <circle cx="370" cy="370" r="7" fill="#ffffff"/>

  <!-- Central Star / Singularity Core -->
  <circle cx="256" cy="256" r="64" fill="url(#coreGlow)"/>
  <circle cx="256" cy="256" r="26" fill="#07080c" stroke="#00e5ff" stroke-width="3"/>
  <circle cx="256" cy="256" r="10" fill="#ffffff"/>

  <!-- Dynamic Waveform Ticks around core -->
  <line x1="256" y1="216" x2="256" y2="204" stroke="#fed330" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="296" x2="256" y2="308" stroke="#fed330" stroke-width="3" stroke-linecap="round"/>
  <line x1="216" y1="256" x2="204" y2="256" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="296" y1="256" x2="308" y2="256" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
</svg>